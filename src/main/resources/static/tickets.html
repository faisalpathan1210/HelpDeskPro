<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDeskPro - Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">HelpDeskPro</span>
    <div class="text-white">
        <span id="who" class="me-3"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4">
    <div id="dash" class="row g-3 mb-4"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Raise a ticket</h5>
            <input id="title" class="form-control mb-2" placeholder="Title">
            <textarea id="description" class="form-control mb-2" rows="2" placeholder="Describe the problem"></textarea>
            <select id="priority" class="form-select mb-2">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>
            <button id="createBtn" class="btn btn-primary">Submit ticket</button>
            <div id="formMsg" class="mt-2"></div>
        </div>
    </div>

    <table class="table table-striped bg-white">
        <thead>
        <tr><th>#</th><th>Title</th><th>Priority</th><th>Status</th><th>Raised by</th><th>Assigned to</th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
</div>

<script src="js/api.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
