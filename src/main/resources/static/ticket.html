<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDeskPro - Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="tickets.html">HelpDeskPro</a>
    <div class="text-white">
        <span id="who" class="me-3"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4" style="max-width: 800px;">
    <a href="tickets.html">&larr; Back to tickets</a>
    <div id="error" class="alert alert-danger mt-3 d-none"></div>

    <div id="ticket" class="card mt-3 d-none">
        <div class="card-body">
            <h4 id="tTitle"></h4>
            <p id="tDesc" class="text-muted"></p>
            <div class="row">
                <div class="col-6 col-md-3"><small class="text-muted">Status</small><div id="tStatus"></div></div>
                <div class="col-6 col-md-3"><small class="text-muted">Priority</small><div id="tPriority"></div></div>
                <div class="col-6 col-md-3"><small class="text-muted">Raised by</small><div id="tBy"></div></div>
                <div class="col-6 col-md-3"><small class="text-muted">Assigned to</small><div id="tTo"></div></div>
            </div>
        </div>
    </div>

    <h5 class="mt-4">Comments</h5>
    <div id="comments" class="mb-2"></div>
    <div class="input-group mb-4">
        <input id="commentText" class="form-control" placeholder="Write a comment">
        <button id="commentBtn" class="btn btn-primary">Send</button>
    </div>

    <h5>Status timeline</h5>
    <ul id="history" class="list-group"></ul>
</div>

<script src="js/api.js"></script>
<script src="js/ticket.js"></script>
</body>
</html>
