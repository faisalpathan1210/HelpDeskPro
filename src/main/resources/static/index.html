<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDeskPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light login-page">
<div class="container" style="max-width: 440px;">
    <h2 class="text-center mt-5 mb-4">HelpDeskPro</h2>

    <div id="message"></div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="loginTab">
            <input id="loginEmail" type="email" class="form-control mb-2" placeholder="Email">
            <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password">
            <button id="loginBtn" class="btn btn-primary w-100">Login</button>
        </div>

        <div class="tab-pane fade" id="registerTab">
            <input id="regName" class="form-control mb-2" placeholder="Name">
            <input id="regEmail" type="email" class="form-control mb-2" placeholder="Email">
            <input id="regPassword" type="password" class="form-control mb-3" placeholder="Password (min 6 characters)">
            <button id="registerBtn" class="btn btn-success w-100">Create account</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
